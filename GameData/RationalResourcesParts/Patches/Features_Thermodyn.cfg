		}
		SUBTYPE
		{
			name = Nitrogen
			title = Liquid Nitrogen
			descriptionSummary = #<b>Inputs</b>: $/RateOutN2$ LqdNitrogen /s + $/RateInEC$ EC /s.<br><b>Output</b>: $/RateInN2$ Nitrogen /s.
			primaryColor = PeacockBlue
			secondaryColor = PeacockBlue
			MODULE
			{
				IDENTIFIER
