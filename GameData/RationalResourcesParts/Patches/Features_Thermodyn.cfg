@PART[RRConverterThermodynS1]:NEEDS[B9PartSwitch,RationalResources,CommunityResourcePack,!Kerbalism]
{
	RateInEC = 3
	
	// 0.2 kg per sec per module
	RateInNH3 = 261
	RateOutNH3 = 0.28587
	RateInCO = 160
	RateOutCO = 0.25316
	RateInCO2 = 225.58
	RateOutCO2 = 0.38
	RateInD2 = 1111.1115
	RateOutD2 = 1.23153
	RateInF2 = 117.92435
	RateOutF2 = 0.13289
	RateInH2 = 2224.69408
	RateOutH2 = 2.82287
	RateInCH4 = 6244.83247
	RateOutCH4 = 10.51899
	RateInN2 = 159.87191
	RateOutN2 = 0.24245
	RateInO2 = 141.84397
	RateOutO2 = 0.17528
	
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Heater 1
		StartActionName = Start Heater 1
		StopActionName = Stop Heater 1
		ToggleActionName = Toggle Heater 1
		AutoShutdown = True
		GeneratesHeat = False
		UseSpecialistBonus = False
		DefaultShutoffTemp = 0.675
		 
		INPUT_RESOURCE
		{
			ResourceName = LqdAmmonia
			Ratio = #$/RateOutNH3$
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = #$/RateInEC$
		}
		OUTPUT_RESOURCE
		{
			ResourceName = Ammonia
			Ratio = #$/RateInNH3$
			FlowMode = STAGE_PRIORITY_FLOW
			DumpExcess = false
		}
	}
	
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = RRGasSwitch1
		switcherDescription = Gas
		switcherDescriptionPlural = Gases
		SUBTYPE
		{
			name = Ammonia
			title = Liquid Ammonia
			descriptionSummary = #<b>Inputs</b>: $/RateOutNH3$ LqdAmmonia /s + $/RateInEC$ EC /s.<br><b>Output</b>: $/RateInNH3$ Ammonia /s .
			primaryColor = BurntRed
			secondaryColor = BurntRed
		}
		SUBTYPE
		{
			name = CarbonDioxide
			title = Liquid CarbonDioxide
			descriptionSummary = #<b>Inputs</b>: $/RateOutCO2$ LqdCO2 /s + $/RateInEC$ EC /s.<br><b>Output</b>: $/RateInCO2$ CarbonDioxide/s.
			primaryColor = WarmGrey
			secondaryColor = WarmGrey
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleResourceConverter
					ConverterName = Heater 1
				}
				DATA
				{
					INPUT_RESOURCE
					{
						ResourceName = LqdCO2
						Ratio = #$/RateOutCO2$
						FlowMode = STAGE_PRIORITY_FLOW
					}
					INPUT_RESOURCE
					{
						ResourceName = ElectricCharge
						Ratio = #$/RateInEC$
					}
					OUTPUT_RESOURCE
					{
						ResourceName = CarbonDioxide
						Ratio = #$/RateInCO2$
						FlowMode = STAGE_PRIORITY_FLOW
						DumpExcess = false
					}
				}
			}
		}
		SUBTYPE
		{
			name = CarbonMonoxide
			title = Liquid CarbonMonoxide
			descriptionSummary = #<b>Inputs</b>: $/RateOutCO$ LqdCO /s + $/RateInEC$ EC /s.<br><b>Output</b>: $/RateInCO$ CarbonMonoxide /s.
			primaryColor = PurpleGrey
			secondaryColor = PurpleGrey
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleResourceConverter
					ConverterName = Heater 1
				}
				DATA
				{
					INPUT_RESOURCE
					{
						ResourceName = LqdCO
						Ratio = #$/RateOutCO$
						FlowMode = STAGE_PRIORITY_FLOW
					}
					INPUT_RESOURCE
					{
						ResourceName = ElectricCharge
						Ratio = #$/RateInEC$
					}
					OUTPUT_RESOURCE
					{
						ResourceName = CarbonMonoxide
						Ratio = #$/RateInCO$
						FlowMode = STAGE_PRIORITY_FLOW
						DumpExcess = false
					}
				}
			}
		}
		SUBTYPE
		{
			name = Deuterium
			title = Liquid Deuterium
			descriptionSummary = #<b>Inputs</b>: $/RateOutD2$ LqdDeuterium /s + $/RateInEC$ EC /s.<br><b>Output</b>: $/RateInD2$ Deuterium /s.
			primaryColor = PowderBlue
			secondaryColor = PowderBlue
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleResourceConverter
					ConverterName = Heater 1
				}
				DATA
				{
					INPUT_RESOURCE
					{
						ResourceName = LqdDeuterium
						Ratio = #$/RateOutD2$
						FlowMode = STAGE_PRIORITY_FLOW
					}
					INPUT_RESOURCE
					{
						ResourceName = ElectricCharge
						Ratio = #$/RateInEC$
					}
					OUTPUT_RESOURCE
					{
						ResourceName = Deuterium
						Ratio = #$/RateInD2$
						FlowMode = STAGE_PRIORITY_FLOW
						DumpExcess = false
					}
				}
			}
		}
		SUBTYPE
		{
			name = Fluorine
			title = Liquid Fluorine
			descriptionSummary = #<b>Inputs</b>: $/RateInF2$ Fluorine /s + $/RateInEC$ EC /s.<br><b>Output</b>: $/RateOutF2$ LqdFluorine /s.
			primaryColor = AcidGreen
			secondaryColor = AcidGreen
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleResourceConverter
					ConverterName = Heater 1
				}
				DATA
				{
					INPUT_RESOURCE
					{
						ResourceName = LqdFluorine
						Ratio = #$/RateOutF2$
						FlowMode = STAGE_PRIORITY_FLOW
						DumpExcess = false
					}
					INPUT_RESOURCE
					{
						ResourceName = ElectricCharge
						Ratio = #$/RateInEC$
					}
					OUTPUT_RESOURCE
					{
						ResourceName = Fluorine
						Ratio = #$/RateInF2$
						FlowMode = STAGE_PRIORITY_FLOW
					}
				}
			}
		}
		SUBTYPE
		{
			name = Hydrogen
			title = Liquid Hydrogen
			descriptionSummary = #<b>Inputs</b>: $/RateOutH2$ LqdHydrogen /s + $/RateInEC$ EC /s.<br><b>Output</b>: $/RateInH2$ Hydrogen /s.
			primaryColor = ResourceColorLqdHydrogen
			secondaryColor = ResourceColorLqdHydrogen
			MODULE
			{
				IDENTIFIER
				{
