		SUBTYPE
		{
			name = Oxygen
			title = Liquid Oxygen
			descriptionSummary = #<b>Inputs</b>: $/RateOutO2$ LqdOxygen /s + $/RateInEC$ EC /s.<br><b>Output</b>: $/RateInO2$ Oxygen /s.
