@PART[RRTankWrap125]:NEEDS[B9PartSwitch]
{
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = Height
		switcherDescription = Height
		switcherDescriptionPlural = Heights
		parentID = RRFuelSwitch
		SUBTYPE
		{
			name = 1x
			title = 1m
			primaryColor = #8d69b0
			secondaryColor = #bfbfbf
			// descriptionSummary = 
			transform = Body1m
			node = bottom
			node = top
		}
		SUBTYPE
		{
			name = 2x
			title = 2m
			primaryColor = #8d69b0
			secondaryColor = #bfbfbf
			// descriptionSummary = 
			transform = Body2m
			volumeAddedToParent = #$/refVolume$
			addedMass = #$/mass$
			addedCost = #$/cost$
			node = bottom01
			node = top01
		}
		SUBTYPE
		{
			name = 4x
			title = 4m
			primaryColor = #8d69b0
			secondaryColor = #bfbfbf
			// descriptionSummary = 
			transform = Body4m
			volumeAddedToParent = #$/refVolume$
			@volumeAddedToParent *= 3
			addedMass = #$/mass$
			@addedMass *= 3
			addedCost = #$/cost$
			@addedCost *= 3
			node = bottom02
			node = top02
		}
	}
}

@PART[RRTankWrapShroud125]:NEEDS[B9PartSwitch,RationalResources]
{
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = TopShroud
		switcherDescription = Top Shroud
		switcherDescriptionPlural = Top Shroud Selections
		parentID = RRFuelSwitch
		SUBTYPE
		{
			name = Off
			title = None
			// descriptionSummary = 
			primaryColor = #8d69b0
			secondaryColor = #666666
			node = top
		}
		SUBTYPE
		{
			name = Fairing
			title = Top Fairing
			descriptionSummary = Adds fuel volume
			primaryColor = #8d69b0
			secondaryColor = #bfbfbf
			addedMass = #$/mass$
			addedCost = #$/cost$
			volumeAddedToParent = #$/refVolume$
			transform = TopShroud1
		}
		SUBTYPE
		{
			name = Mount
			title = Top Mount
			// descriptionSummary = 
			primaryColor = #8d69b0
			secondaryColor = #bfbfbf
			addedMass = #$/mass$
			@addedMass *= 0.3
			addedCost = #$/cost$
			@addedCost *= 0.3
			transform = TopShroud2
			node = top01
			node = top02
		}
	}
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = BottomShroud
		switcherDescription = Bottom Shroud
		switcherDescriptionPlural = Bottom Shroud Selections
		parentID = RRFuelSwitch
		SUBTYPE
		{
			name = Off
			title = None
			// descriptionSummary = 
			primaryColor = #8d69b0
			secondaryColor = #666666
			node = bottom
		}
		SUBTYPE
		{
			name = Fairing
			title = Bottom Fairing
			descriptionSummary = Adds fuel volume
			primaryColor = #8d69b0
			secondaryColor = #bfbfbf
			addedMass = #$/mass$
			addedCost = #$/cost$
			volumeAddedToParent = #$/refVolume$
			transform = BottomShroud1
		}
		SUBTYPE
		{
			name = Mount
			title = Bottom Mount
			// descriptionSummary = 
			primaryColor = #8d69b0
			secondaryColor = #bfbfbf
			addedMass = #$/mass$
			@addedMass *= 0.3
			addedCost = #$/cost$
			@addedCost *= 0.3
			transform = BottomShroud2
			node = bottom01
			node = bottom02
		}
	}
}

@PART[RRConverterDACC|RRConverterCryomatS2|RRTankStackGas*|RRTankStackCryo*]:NEEDS[B9PartSwitch]
{
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = Shroud
		// switcherDescription = 
		// switcherDescriptionPlural = 
		SUBTYPE
		{
			name = Off
			title = Bare
			primaryColor = #8d69b0
			secondaryColor = #666666
			transform = Unshrouded
		}
		SUBTYPE
		{
			name = On
			title = Shrouded
			primaryColor = #8d69b0
			secondaryColor = #bfbfbf
			addedMass = #$/mass$
			@addedMass *= 0.1
			addedCost = #$/cost$
			@addedCost *= 0.1
			transform = Shrouded
		}
	}
}

@PART[RRTankWrap125]:NEEDS[ConfigurableContainers/Parts]
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[Height]]
	{
		@SUBTYPE,1
		{
			!volumeAddedToParent = nope
		}
		@SUBTYPE,2
		{
			!volumeAddedToParent = nope
		}
	}
}
@PART[RRTankWrapShroud125]:NEEDS[ConfigurableContainers/Parts]
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[TopShroud]]
	{
		@SUBTYPE,1
		{
			!volumeAddedToParent = nope
		}
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[BottomShroud]]
	{
		@SUBTYPE,1
		{
			!volumeAddedToParent = nope
		}
	}
}

