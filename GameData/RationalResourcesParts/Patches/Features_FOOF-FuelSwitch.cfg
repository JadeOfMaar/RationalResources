@PART[RREngineFOOF-*]:NEEDS[!ChemicalPropulsion]
{
	ChemTechAbsent = Yes
}
@PART[RREngineFOOF-*]:HAS[#ChemTechAbsent[Yes]]:NEEDS[B9PartSwitch,CommunityResourcePack,!ClassicStock]
{
	IspSLLF = #$MODULE[ModuleEnginesFX],0/atmosphereCurve/key,1[1, ]$
	IspVacLF = #$MODULE[ModuleEnginesFX],0/atmosphereCurve/key,0[1, ]$
	IspSLH2 = #$MODULE[ModuleEnginesFX],0/atmosphereCurve/key,1[1, ]$
	IspVacH2 = #$MODULE[ModuleEnginesFX],0/atmosphereCurve/key,0[1, ]$
	IspSLCH4 = #$MODULE[ModuleEnginesFX],0/atmosphereCurve/key,1[1, ]$
	IspVacCH4 = #$MODULE[ModuleEnginesFX],0/atmosphereCurve/key,0[1, ]$
	IspSLNH3 = #$MODULE[ModuleEnginesFX],0/atmosphereCurve/key,1[1, ]$
	IspVacNH3 = #$MODULE[ModuleEnginesFX],0/atmosphereCurve/key,0[1, ]$
	@IspSLH2 *= 1.5
	@IspVacH2 *= 1.5
	@IspSLCH4 *= 1.2
	@IspVacCH4 *= 1.2
	@IspSLNH3 *= 0.95
	@IspVacNH3 *= 0.95
	ThrustLF = #$MODULE[ModuleEnginesFX],0/maxThrust$
	ThrustH2 = #$MODULE[ModuleEnginesFX],0/maxThrust$
	ThrustCH4 = #$MODULE[ModuleEnginesFX],0/maxThrust$
	ThrustNH3 = #$MODULE[ModuleEnginesFX],0/maxThrust$
	@ThrustH2 *= 0.7
	@ThrustCH4 *= 0.92
	@ThrustNH3 *= 0.85
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = FuelSelect
		switcherDescription = Fuel Options
		switcherDescriptionPlural = Fuel Options
		switchInFlight = True
		SUBTYPE
		{
			name = LF
			title = LiquidFuel
			primaryColor = ResourceColorLiquidFuel
			secondaryColor = AcidGreen
			descriptionSummary = The engine consumes LiquidFuel
			descriptionDetail = #<b>Isp (ClosedCycle)</b>: $/IspSLLF$ / $/IspVacLF$ sec <br><b>Thrust</b>: $/ThrustLF$ kN
		}
		SUBTYPE
		{
			name = LH2
			title = LqdHydrogen
			primaryColor = ResourceColorLqdHydrogen
			secondaryColor = AcidGreen
			descriptionSummary = The engine consumes LqdHydrogen
			descriptionDetail = #<b>Isp (ClosedCycle)</b>: <color="yellow">$/IspSLH2$</color> / <color="yellow">$/IspVacH2$</color> sec <br><b>Thrust</b>: <color="yellow">$/ThrustH2$</color> kN
			
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleEnginesFX
				}
				DATA
				{
					maxThrust = #$/ThrustH2$
					PROPELLANT
					{
						name = LqdHydrogen
						ratio = 3.75
						DrawGauge = True
					}
					PROPELLANT
					{
						name = LqdFluorine
						ratio = 1.25
						DrawGauge = True
					}
					#/MODULE[ModuleEnginesFX],0/atmosphereCurve {}
					@atmosphereCurve
					{
						@key,0[1, ] = #$/IspVacH2$
						@key,1[1, ] = #$/IspSLH2$
					}
				}
			}
		}
		SUBTYPE
		{
			name = LCH4
			title = LqdMethane
			primaryColor = ResourceColorLqdMethane
			secondaryColor = AcidGreen
			descriptionSummary = The engine consumes LqdMethane
			descriptionDetail = #<b>Isp (ClosedCycle)</b>: <color="yellow">$/IspSLCH4$</color> / <color="yellow">$/IspVacCH4$</color> sec <br><b>Thrust</b>: <color="yellow">$/ThrustCH4$</color> kN
			
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleEnginesFX
				}
				DATA
				{
					maxThrust = #$/ThrustCH4$
					PROPELLANT
					{
						name = LqdMethane
						ratio = 2.222
						DrawGauge = True
					}
					PROPELLANT
					{
						name = LqdFluorine
						ratio = 2.778
						DrawGauge = True
					}
					#/MODULE[ModuleEnginesFX],0/atmosphereCurve {}
					@atmosphereCurve
					{
						@key,0[1, ] = #$/IspVacCH4$
						@key,1[1, ] = #$/IspSLCH4$
					}
				}
			}
		}
		SUBTYPE
		{
			name = LNH3
			title = LqdAmmonia
			primaryColor = BurntRed
			secondaryColor = AcidGreen
			descriptionSummary = The engine consumes LqdAmmonia
			descriptionDetail = #<b>Isp (ClosedCycle)</b>: <color="yellow">$/IspSLNH3$</color> / <color="yellow">$/IspVacNH3$</color> sec <br><b>Thrust</b>: <color="yellow">$/ThrustNH3$</color> kN
			
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleEnginesFX
				}
				DATA
				{
					maxThrust = #$/ThrustNH3$
					PROPELLANT
					{
						name = LqdAmmonia
						ratio = 2.222
						DrawGauge = True
					}
					PROPELLANT
					{
						name = LqdFluorine
						ratio = 2.778
						DrawGauge = True
					}
					#/MODULE[ModuleEnginesFX],0/atmosphereCurve {}
					@atmosphereCurve
					{
						@key,0[1, ] = #$/IspVacNH3$
						@key,1[1, ] = #$/IspSLNH3$
					}
				}
			}
		}
	}
}


@PART[RREngineFOOF-*]:HAS[#ChemTechAbsent[Yes]]:NEEDS[B9PartSwitch,ClassicStock,!CommunityResourcePack]
{
	@MODULE[ModuleEnginesFX]
	{
		@PROPELLANT,0
		{
			@name = Propellium
			@ratio = 5
		}
		// !PROPELLANT,1 {}
		@PROPELLANT,1
		{
			@name = FumingButterscotch
			@ratio = 1
		}
		@atmosphereCurve
		{
			@key,0[1, ] *= 1.5
			@key,1[1, ] *= 1.5
		}
	}
}