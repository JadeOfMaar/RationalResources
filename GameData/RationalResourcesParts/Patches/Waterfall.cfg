@PART[RREngineFOOF*]:NEEDS[Waterfall]
{
	@EFFECTS
	{
		@running_closed
		{
			!MODEL_MULTI_PARTICLE,* {}
		}
		@running_open
		{
			!MODEL_MULTI_PARTICLE,* {}
		}
	}
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = #$/MODULE[ModuleEnginesFX]/engineID$
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			engineID = #$/MODULE[ModuleEnginesFX]/engineID$
		}
		CONTROLLER
		{
			name = random
			linkedTo = random
			range = 0.7, 1
		}
		TEMPLATE
		{
			templateName = waterfall-hypergolic-aerozine50-upper-1 // waterfall-hypergolic-white-upper-1
			overrideParentTransform = thrustTransform
			scale = 0.42, 0.42, 0.42
			rotation = 0, 0, 0
			position = 0, 0, 0
		}
	}
}

