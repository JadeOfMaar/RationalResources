// Cleanup
@PART:HAS[#RRConverter,#isStock]:BEFORE[RationalResourcesKerbalism]
{
	!MODULE[Reliability],* {}
	!MODULE[ProcessController],* {}
	!MODULE[Configure],* {}
	!SETUP,* {}
}

@PART:HAS[#RRConverter[Set],~isStock]:FOR[RationalResourcesKerbalism]
{
	@tags ^= :$: _kerbalism
}

