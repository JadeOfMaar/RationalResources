@PART:HAS[#RRFuelCell[Set]]:BEFORE[RationalResourcesKerbalism]
{
	!MODULE[Reliability],* {}
	!MODULE[ProcessController],* {}
	!MODULE[Configure],* {}
	!SETUP,* {}
}

@PART:HAS[#RRFuelCell[Set]]:FOR[RationalResourcesKerbalism]
{
	@RRFuelCell = isSet
	MODULE
	{
		name = ProcessController
		resource = _H2FuelCell
		title = Hydrogen Fuel Cell
		capacity *= #$/RRPower$
	}
	MODULE
	{
		name = ProcessController
		resource = _CH4FuelCell
		title = Methane Fuel Cell
		capacity *= #$/RRPower$
	}
	MODULE
	{
		name = ProcessController
		resource = _COFuelCell
		title = Carbon Monoxide Fuel Cell
		capacity *= #$/RRPower$
	}
	MODULE
	{
		name = ProcessController
		resource = _NH3FuelCell
		title = Ammonia Fuel Cell
		capacity *= #$/RRPower$
	}
	MODULE
	{
		name = ProcessController
		resource = _AlcoFuelCell
		title = Ethanol Fuel Cell
		capacity *= #$/RRPower$
	}
	
	MODULE
	{
		name = Configure
		title = Fuel Cell
		slots = 1
		UPGRADES
		{
			UPGRADE
			{
				name__ = Upgrade-Slots
				techRequired__ = electronics
				slots = 2
			}
		}
		SETUP
		{
			name = Hydrogen
			desc = Burns <b>LqdHydrogen</b> and <b>LqdOxygen</b>. <b>Water</b> is its by-product.
			tech = basicScience
			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _H2FuelCell
			}
		}
		SETUP
		{
			name = Methane
			desc = Burns <b>LqdMethane</b> and <b>LqdOxygen</b>. <b>Water</b> and <b>CarbonDioxide</b> are its by-products.
			tech = basicScience
			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _CH4FuelCell
			}
		}
		SETUP
		{
			name = Carbon Monoxide
			desc = Burns <b>LqdCO</b> and <b>LqdOxygen</b>. <b>CarbonDioxide</b> is its by-product.
			tech = basicScience
			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _COFuelCell
			}
		}
		SETUP
		{
			name = Ammonia
			desc = Burns <b>LqdAmmonia</b> and <b>LqdOxygen</b>. <b>Water</b>, <b>Nitrogen</b> and <b>Oxygen</b> are its by-products.
			tech = basicScience
			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _NH3FuelCell
			}
		}
		SETUP
		{
			name = Ethanol
			desc = Burns <b>Ethanol</b> and <b>LqdOxygen</b>. <b>Water</b>, <b>Methane</b>, <b>CarbonDioxide</b> and <b>Hydrogen</b> are its by-products.
			tech = basicScience
			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _AlcoFuelCell
			}
		}
	}
}