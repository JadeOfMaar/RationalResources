@PART:HAS[#RRFuelCell[Set]]:BEFORE[RationalResourcesKerbalism]
{
	!MODULE[Reliability],* {}
	!MODULE[ProcessController],* {}
	!MODULE[Configure],* {}
	!SETUP,* {}
}

@PART:HAS[#RRFuelCell[Set]]:FOR[RationalResourcesKerbalism]
{
	@RRFuelCell = isSet
	MODULE
	{
		name = ProcessController
		resource = _RRFuelCellH2
		title = RR Hydrogen Fuel Cell
		capacity *= #$/RRPower$
	}
	MODULE
	{
		name = ProcessController
		resource = _RRFuelCellCH4
		title = RR Methane Fuel Cell
		capacity *= #$/RRPower$
	}
	MODULE
	{
		name = ProcessController
		resource = _RRFuelCellCO
		title = RR Carbon Monoxide Fuel Cell
		capacity *= #$/RRPower$
	}
	MODULE
	{
		name = ProcessController
		resource = _RRFuelCellNH3
		title = RR Ammonia Fuel Cell
		capacity *= #$/RRPower$
	}
	MODULE
	{
		name = ProcessController
		resource = _RRFuelCellC2H6O
		title = RR Ethanol Fuel Cell
		capacity *= #$/RRPower$
	}
	
	MODULE
	{
		name = Configure
		title = Fuel Cell
		slots = 1
		UPGRADES
		{
			UPGRADE
			{
				name__ = Upgrade-Slots
				techRequired__ = electronics
				slots = 2
			}
		}
		SETUP
		{
			name = RR Hydrogen
			desc = Burns <b>LqdHydrogen</b> and <b>LqdOxygen</b>. <b>Water</b> is its by-product.
			tech = basicScience
			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _RRFuelCellH2
			}
		}
		SETUP
		{
			name = RR Methane
			desc = Burns <b>LqdMethane</b> and <b>LqdOxygen</b>. <b>Water</b> and <b>CarbonDioxide</b> are its by-products.
			tech = basicScience
			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _RRFuelCellCH4
			}
		}
		SETUP
		{
			name = RR Carbon Monoxide
			desc = Burns <b>LqdCO</b> and <b>LqdOxygen</b>. <b>CarbonDioxide</b> is its by-product.
			tech = basicScience
			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _RRFuelCellCO
			}
		}
		SETUP
		{
			name = RR Ammonia
			desc = Burns <b>LqdAmmonia</b> and <b>LqdOxygen</b>. <b>Water</b>, <b>Nitrogen</b> and <b>Oxygen</b> are its by-products.
			tech = basicScience
			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _RRFuelCellNH3
			}
		}
		SETUP
		{
			name = RR Ethanol
			desc = Burns <b>Ethanol</b> and <b>LqdOxygen</b>. <b>Water</b>, <b>Methane</b>, <b>CarbonDioxide</b> and <b>Hydrogen</b> are its by-products.
			tech = basicScience
			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _RRFuelCellC2H6O
			}
		}
	}
}