@PART[restock-apu-radial-1]:NEEDS[CommunityResourcePack,!RationalResourcesOmniConverters,RestockPlus,!Kerbalism,!OnDemandFuelCells]:AFTER[RationalResourcesCompanion]
{
	@description ^= :$: <br><#4FBBFF>Fuel cell can accept other fuels.</color><br><br><color="yellow">This part uses core heat but needs no radiator.</color>
	@MODULE[ModuleResourceConverter]
	{
		@GeneratesHeat = True
		TemperatureModifier
		{
			key = 280 250 0 0
			key = 430 1140 18.3416 18.3416
			key = 500 2250 -1.147305 -46.264
			key = 501 0 0 0
		}
		DefaultShutoffTemp = 0.45
		ThermalEfficiency 
		{
			key = 280 0
			key = 500 1 0 0
			key = 505 1 0 0
			key = 550 1.5 0 0
			key = 700 0 0 0
		}
	}
	MODULE
	{
		name = ModuleOverheatDisplay
	}
	MODULE
	{
		name = ModuleCoreHeat
		//Internal temp goal - we don't transfer till we hit this point
		CoreTempGoal = 500
		//At what core temperature do we shut down all generators on this part?
		CoreShutdownTemp = 700
		//Maximum amount of radiator capacity we can consume - 50 = 1 small		
		MaxCoolant = 50
		// Uninteresting stuff
		CoreToPartRatio = 0.1
		CoreTempGoalAdjustment = 0
		CoreEnergyMultiplier = 0.1
		HeatRadiantMultiplier = 0.05
		CoolingRadiantMultiplier = 0
		HeatTransferMultiplier = 0
		CoolantTransferMultiplier = 0.01
		radiatorCoolingFactor = 1
		radiatorHeatingFactor = 0.05
		MaxCalculationWarp = 1000
	}
	
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = FuelSelect
		switcherDescription = Fuel 
		switcherDescriptionPlural = Fuel Selections
		switchInFlight = True
		SUBTYPE
		{
			name = MONO
			title = Mono
			primaryColor = ResourceColorMonoPropellant
			secondaryColor = ResourceColorMonoPropellant
			descriptionSummary = MonoPropellant
			descriptionDetail = <b>Inputs: </b><br>- 0.006 Mono / sec <br><b>Outputs = </b> 1.5 EC / sec <br><br><color="orange">Please quicksave + quickload after applying.</color>
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleResourceConverter
				}
				DATA
				{
					INPUT_RESOURCE
					{
						ResourceName = MonoPropellant
						Ratio = 0.006
					}
				}
			}
		}
		SUBTYPE
		{
			name = Ammonia
			title = Ammonia
			primaryColor = BurntRed
			secondaryColor = BurntRed
			descriptionSummary = LqdAmmonia
			descriptionDetail = <b>Inputs: </b><br>- 0.018 NH3 / sec <br><b>Outputs = </b> 1.5 EC / sec <br><br><color="orange">Please quicksave + quickload after applying.</color>
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleResourceConverter
				}
				DATA
				{
					INPUT_RESOURCE
					{
						ResourceName = LqdAmmonia
						Ratio = 0.018
					}
				}
			}
		}
	}
}