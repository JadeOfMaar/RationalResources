{
	@MODULE[ModuleResourceConverter]:HAS[#ConverterName[RR?Fuel?Cell]]
	{
		!INPUT_RESOURCE,* {}
		INPUT_RESOURCE
		{
			ResourceName = Ore
			Ratio = #$/rrOrein$
			FlowMode = STAGE_PRIORITY_FLOW
		}
