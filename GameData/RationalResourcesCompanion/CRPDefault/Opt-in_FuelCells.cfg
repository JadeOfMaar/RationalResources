@PART:HAS[#RRFuelCell[Set]]:NEEDS[CommunityResourcePack,!RationalResourcesOmniConverters,!Kerbalism,!OnDemandFuelCells]:AFTER[RationalResourcesCompanion]
{
	@RRFuelCell = isSet
	@description ^= :$: <br><#4FBBFF>Fuel cell can accept other fuels.</color>
	
	rrOrein =  0.45 // derived from SMX Fuel Cell input
	rrOreEC = 18
	// - - -
	rrKFin = 0.00301
	rrKOin = 0.00368
	rrKEC = 150 // 149.55
	rrHFin = 0.0386
	rrHOin = 0.00257
	rrHEC = 157 // 157.027
	rrMFin = 0.01225
	rrMOin = 0.00408
	rrMEC = 165 // 165.103
	rrAFin = 0.01532
	rrAOin = 0.00383
	rrAEC = 121 // 120.762
	rrCFin = 0.03113
	rrCOin = 0.00623
	rrCEC = 90 // 89.73
	rrEFin = 0.01718
	rrEOin = 0.003436
	rrEEC = 105 // 104.087
	// - - -
	@rrKFin:NEEDS[ChemicalPropulsion|RealFuels] = 0.00397
	@rrKOin:NEEDS[ChemicalPropulsion|RealFuels] = 0.01191
	@rrHFin:NEEDS[ChemicalPropulsion|RealFuels] = 0.03458
	@rrHOin:NEEDS[ChemicalPropulsion|RealFuels] = 0.01153
	@rrMFin:NEEDS[ChemicalPropulsion|RealFuels] = 0.01384
	@rrMOin:NEEDS[ChemicalPropulsion|RealFuels] = 0.0173
	@rrAFin:NEEDS[ChemicalPropulsion|RealFuels] = 0.01405
	@rrAOin:NEEDS[ChemicalPropulsion|RealFuels] = 0.01757
	@rrCFin:NEEDS[ChemicalPropulsion|RealFuels] = 0.02886
	@rrCOin:NEEDS[ChemicalPropulsion|RealFuels] = 0.02886
	@rrEFin:NEEDS[ChemicalPropulsion|RealFuels] = 0.01593
	@rrEOin:NEEDS[ChemicalPropulsion|RealFuels] = 0.01593
	// - - -
	@rrKFin *= #$RRPower$
	@rrKOin *= #$RRPower$
	@rrKEC *= #$RRPower$
	@rrHFin *= #$RRPower$
	@rrHOin *= #$RRPower$
	@rrHEC *= #$RRPower$
	@rrMFin *= #$RRPower$
	@rrMOin *= #$RRPower$
	@rrMEC *= #$RRPower$
	@rrAFin *= #$RRPower$
	@rrAOin *= #$RRPower$
	@rrAEC *= #$RRPower$
	@rrCFin *= #$RRPower$
	@rrCOin *= #$RRPower$
	@rrCEC *= #$RRPower$
	@rrEFin *= #$RRPower$
	@rrEOin *= #$RRPower$
	@rrEEC *= #$RRPower$
	@rrOrein *= #$RRPower$
	@rrOreEC *= #$RRPower$
	
	!MODULE[ModuleResourceConverter]:HAS[~Tag[*]],* {}
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = RR Fuel Cell
		StartActionName = Start Fuel Cell
		StopActionName = Stop Fuel Cell
		ToggleActionName = Toggle Fuel Cell
		FillAmount = 0.95
		Tag = RR
		AutoShutdown = False
		GeneratesHeat = False
		UseSpecialistBonus = False
		INPUT_RESOURCE
		{
			ResourceName = LiquidFuel
			Ratio = #$/rrKFin$
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = Oxidizer
			Ratio = #$/rrKOin$
			FlowMode = STAGE_PRIORITY_FLOW
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = #$/rrKEC$
			DumpExcess = False
		}
	}
	
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = RRFuelCell
		switcherDescription = Fuel 
		switcherDescriptionPlural = Fuel Selections
		switchInFlight = True
	}
	
	%RESOURCE[ElectricCharge]
	{
		%amount = 300
		%maxAmount = 300
		@amount *= #$/RRPower$
		@maxAmount *= #$/RRPower$
	}
}

