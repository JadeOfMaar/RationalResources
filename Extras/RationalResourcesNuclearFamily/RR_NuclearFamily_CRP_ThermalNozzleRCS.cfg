// This patch causes the RCS to require LH2 when any one of these is installed: 
// CryoEngines, Kerbal Atomics, Rational Resources.

@PART:HAS[#RRTN[Yes],@MODULE[ModuleRCSFX]]:FOR[RationalResourcesNuclearFamily]
{
	@RRTN = Joined
	// Let's go for 1.4x the Isp values of these fuels as given in RRNF
	IspVacLF = #$MODULE[ModuleRCSFX]/atmosphereCurve/key,0[1, ]$ // get vac Isp number; 800
	IspASLLF = #$MODULE[ModuleRCSFX]/atmosphereCurve/key,1[1, ]$ // get ASL Isp number; 160
	IspMult = #$IspVacLF$
	@IspMult /= 800
	
	IspVacH2 = 800 // 800
	IspASLH2 = 232 // - 71%
	IspVacCH4 = 606 // 606
	IspASLCH4 = 176 // - 71%
  	IspVacCO = 253 // 253
	IspASLCO = 197 // - 22%
	IspVacCO2 = 283 // 283
	IspASLCO2 = 221 // - 22%
	IspVacH2O = 370 // 370
	IspASLH2O = 200 // - 46%
  	IspVacN2 = 253 // 253
	IspASLN2 = 197 // - 22%
   	IspVacNH3 = 400 // 400
	IspASLNH3 = 200 // - 50%
	
	@IspVacH2 *= #$IspMult$
	@IspASLH2 *= #$IspMult$
	@IspVacCH4 *= #$IspMult$
	@IspASLCH4 *= #$IspMult$
  	@IspVacCO *= #$IspMult$
	@IspASLCO *= #$IspMult$
	@IspVacCO2 *= #$IspMult$
	@IspASLCO2 *= #$IspMult$
	@IspVacH2O *= #$IspMult$
	@IspASLH2O *= #$IspMult$
  	@IspVacN2 *= #$IspMult$
	@IspASLN2 *= #$IspMult$
   	@IspVacNH3 *= #$IspMult$
	@IspASLNH3 *= #$IspMult$
	
	ThrustVacH2 = #$MODULE[ModuleRCSFX]/thrusterPower$
	ThrustVacCH4 = #$MODULE[ModuleRCSFX]/thrusterPower$
	@ThrustVacCH4 *= 1.25
	ThrustVacCO = #$MODULE[ModuleRCSFX]/thrusterPower$
	@ThrustVacCO *= 2.58
	ThrustVacCO2 = #$MODULE[ModuleRCSFX]/thrusterPower$
	@ThrustVacCO2 *= 2.41
	ThrustVacH2O = #$MODULE[ModuleRCSFX]/thrusterPower$
	@ThrustVacH2O *= 1.91
	ThrustVacN2 = #$MODULE[ModuleRCSFX]/thrusterPower$
	@ThrustVacN2 *= 2.58
	ThrustVacNH3 = #$MODULE[ModuleRCSFX]/thrusterPower$
	@ThrustVacNH3 *= 1.67
	
	// LiquidFuel
	// Calculate ASL thrust
	ThrustSLLF = #$IspASLLF$
	@ThrustSLLF /= #$IspVacLF$
	@ThrustSLLF *= #$ThrustVacH2$
	// Regex reduce value to 2dp
	@ThrustSLLF += 0.005
	@ThrustSLLF *= 100
	@ThrustSLLF = #$ThrustSLLF[0,.]$
	@ThrustSLLF /= 100
	// Calculate flameout pressure from Isp gradient: (Isp(Vac) / ( Isp(Vac) - Isp(ASL) ))
	AtmFlameoutLFTemp = #$IspVacLF$
	@AtmFlameoutLFTemp -= #$IspASLLF$
	AtmFlameoutLF = #$IspVacLF$
	@AtmFlameoutLF /= #$AtmFlameoutLFTemp$
	// Regex reduce value to 2dp
	@AtmFlameoutLF += 0.005
	@AtmFlameoutLF *= 100
	@AtmFlameoutLF = #$AtmFlameoutLF[0,.]$
	@AtmFlameoutLF /= 100
	
	// Hydrogen H2
	// Calculate ASL thrust
	ThrustSLH2 = #$IspASLH2$
	@ThrustSLH2 /= #$IspVacH2$
	@ThrustSLH2 *= #$ThrustVacH2$
	// Regex reduce value to 2dp
	@ThrustSLH2 += 0.005
	@ThrustSLH2 *= 100
	@ThrustSLH2 = #$ThrustSLH2[0,.]$
	@ThrustSLH2 /= 100
	// Calculate flameout pressure from Isp gradient: (Isp(Vac) / ( Isp(Vac) - Isp(ASL) ))
	AtmFlameoutH2Temp = #$IspVacH2$
	@AtmFlameoutH2Temp -= #$IspASLH2$
	AtmFlameoutH2 = #$IspVacH2$
	@AtmFlameoutH2 /= #$AtmFlameoutH2Temp$
	// Regex reduce value to 2dp
	@AtmFlameoutH2 += 0.005
	@AtmFlameoutH2 *= 100
	@AtmFlameoutH2 = #$AtmFlameoutH2[0,.]$
	@AtmFlameoutH2 /= 100
	
	// Methane CH4
	// Calculate ASL thrust
	ThrustSLCH4 = #$IspASLCH4$
	@ThrustSLCH4 /= #$IspVacCH4$
	@ThrustSLCH4 *= #$ThrustVacCH4$
	// Regex reduce value to 2dp
	@ThrustSLCH4 += 0.005
	@ThrustSLCH4 *= 100
	@ThrustSLCH4 = #$ThrustSLCH4[0,.]$
	@ThrustSLCH4 /= 100
	// Calculate flameout pressure from Isp gradient: (Isp(Vac) / ( Isp(Vac) - Isp(ASL) ))
	AtmFlameoutCH4Temp = #$IspVacCH4$
	@AtmFlameoutCH4Temp -= #$IspASLCH4$
	AtmFlameoutCH4 = #$IspVacCH4$
	@AtmFlameoutCH4 /= #$AtmFlameoutCH4Temp$
	// Regex reduce value to 2dp
	@AtmFlameoutCH4 += 0.005
	@AtmFlameoutCH4 *= 100
	@AtmFlameoutCH4 = #$AtmFlameoutCH4[0,.]$
	@AtmFlameoutCH4 /= 100
	
	// Water H2O
	// Calculate ASL thrust
	ThrustSLH2O = #$IspASLH2O$
	@ThrustSLH2O /= #$IspVacH2O$
	@ThrustSLH2O *= #$ThrustVacH2O$
	// Regex reduce value to 2dp
	@ThrustSLH2O += 0.005
	@ThrustSLH2O *= 100
	@ThrustSLH2O = #$ThrustSLH2O[0,.]$
	@ThrustSLH2O /= 100
	// Calculate flameout pressure from Isp gradient: (Isp(Vac) / ( Isp(Vac) - Isp(ASL) ))
	AtmFlameoutH2OTemp = #$IspVacH2O$
	@AtmFlameoutH2OTemp -= #$IspASLH2O$
	AtmFlameoutH2O = #$IspVacH2O$
	@AtmFlameoutH2O /= #$AtmFlameoutH2OTemp$
	// Regex reduce value to 2dp
	@AtmFlameoutH2O += 0.005
	@AtmFlameoutH2O *= 100
	@AtmFlameoutH2O = #$AtmFlameoutH2O[0,.]$
	@AtmFlameoutH2O /= 100
 	
 	// Nitrogen N2
	// Calculate ASL thrust
	ThrustSLN2 = #$IspASLN2$
	@ThrustSLN2 /= #$IspVacN2$
	@ThrustSLN2 *= #$ThrustVacN2$
	// Regex reduce value to 2dp
	@ThrustSLN2 += 0.005
	@ThrustSLN2 *= 100
	@ThrustSLN2 = #$ThrustSLN2[0,.]$
	@ThrustSLN2 /= 100
	// Calculate flameout pressure from Isp gradient: (Isp(Vac) / ( Isp(Vac) - Isp(ASL) ))
	AtmFlameoutN2Temp = #$IspVacN2$
	@AtmFlameoutN2Temp -= #$IspASLN2$
	AtmFlameoutN2 = #$IspVacN2$
	@AtmFlameoutN2 /= #$AtmFlameoutN2Temp$
	// Regex reduce value to 2dp
	@AtmFlameoutN2 += 0.005
	@AtmFlameoutN2 *= 100
	@AtmFlameoutN2 = #$AtmFlameoutN2[0,.]$
	@AtmFlameoutN2 /= 100
	
 	// Ammonia NH3
	// Calculate ASL thrust
	ThrustSLNH3 = #$IspASLNH3$
	@ThrustSLNH3 /= #$IspVacNH3$
	@ThrustSLNH3 *= #$ThrustVacNH3$
	// Regex reduce value to 2dp
	@ThrustSLNH3 += 0.005
	@ThrustSLNH3 *= 100
	@ThrustSLNH3 = #$ThrustSLNH3[0,.]$
	@ThrustSLNH3 /= 100
	// Calculate flameout pressure from Isp gradient: (Isp(Vac) / ( Isp(Vac) - Isp(ASL) ))
	AtmFlameoutNH3Temp = #$IspVacNH3$
	@AtmFlameoutNH3Temp -= #$IspASLNH3$
	AtmFlameoutNH3 = #$IspVacNH3$
	@AtmFlameoutNH3 /= #$AtmFlameoutNH3Temp$
	// Regex reduce value to 2dp
	@AtmFlameoutNH3 += 0.005
	@AtmFlameoutNH3 *= 100
	@AtmFlameoutNH3 = #$AtmFlameoutNH3[0,.]$
	@AtmFlameoutNH3 /= 100

 	// Carbon Monoxide CO
	// Calculate ASL thrust
	ThrustSLCO = #$IspASLCO$
	@ThrustSLCO /= #$IspVacCO$
	@ThrustSLCO *= #$ThrustVacCO$
	// Regex reduce value to 2dp
	@ThrustSLCO += 0.005
	@ThrustSLCO *= 100
	@ThrustSLCO = #$ThrustSLCO[0,.]$
	@ThrustSLCO /= 100
	// Calculate flameout pressure from Isp gradient: (Isp(Vac) / ( Isp(Vac) - Isp(ASL) ))
	AtmFlameoutCOTemp = #$IspVacCO$
	@AtmFlameoutCOTemp -= #$IspASLCO$
	AtmFlameoutCO = #$IspVacCO$
	@AtmFlameoutCO /= #$AtmFlameoutCOTemp$
	// Regex reduce value to 2dp
	@AtmFlameoutCO += 0.005
	@AtmFlameoutCO *= 100
	@AtmFlameoutCO = #$AtmFlameoutCO[0,.]$
	@AtmFlameoutCO /= 100
	
	// Carbon Dioxide CO2
	// Calculate ASL thrust
	ThrustSLCO2 = #$IspASLCO2$
	@ThrustSLCO2 /= #$IspVacCO2$
	@ThrustSLCO2 *= #$ThrustVacCO2$
	// Regex reduce value to 2dp
	@ThrustSLCO2 += 0.005
	@ThrustSLCO2 *= 100
	@ThrustSLCO2 = #$ThrustSLCO2[0,.]$
	@ThrustSLCO2 /= 100
	// Calculate flameout pressure from Isp gradient: (Isp(Vac) / ( Isp(Vac) - Isp(ASL) ))
	AtmFlameoutCO2Temp = #$IspVacCO2$
	@AtmFlameoutCO2Temp -= #$IspASLCO2$
	AtmFlameoutCO2 = #$IspVacCO2$
	@AtmFlameoutCO2 /= #$AtmFlameoutCO2Temp$
	// Regex reduce value to 2dp
	@AtmFlameoutCO2 += 0.005
	@AtmFlameoutCO2 *= 100
	@AtmFlameoutCO2 = #$AtmFlameoutCO2[0,.]$
	@AtmFlameoutCO2 /= 100
	
	@description ^= :$: <br><#4FBBFF>RCS can accept other fuels.</color>
	@MODULE[ModuleRCSFX]
	{
		@resourceName = LqdHydrogen
		!PROPELLANT[ThermalPower] {}
		@PROPELLANT
		{
			@name = LqdHydrogen
			%ignoreForThrustCurve = True
		}
		@atmosphereCurve
		{
			!key,* = nope
			key = #0 $/IspVacH2$
			key = #1 $/IspASLH2$
			key = #$/AtmFlameoutH2$ 0.001
		}
	}
	@MODULE[ModuleRCSFX]
	{
		PROPELLANT
		{
			name = ThermalPower
			ratio = 0.8708
			@ratio *= #$/IspMult$
			IgnoreForIsp = True
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
	}
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = RCS
		switcherDescription = RCS Mode
		switcherDescriptionPlural = RCS Modes
		switchInFlight = True
		
		SUBTYPE
		{
			name = LH2
			title = Liquid Hydrogen
			primaryColor = ResourceColorLqdHydrogen
			secondaryColor = ResourceColorLqdHydrogen
			defaultSubtypePriority = 1
			descriptionDetail = #The thruster consumes LqdHydrogen.<br><b>Isp:</b> $/IspASLH2$ / $/IspVacH2$s <br><b>Thrust:</b> $/ThrustSLH2$ / $/ThrustVacH2$ kN<br><b>Flameout</b>: $/AtmFlameoutH2$ atm
		}
		SUBTYPE
		{
			name = LCH4
			title = Liquid Methane
			primaryColor = ResourceColorLqdMethane
			secondaryColor = ResourceColorLqdMethane
			descriptionDetail = #The thruster consumes LqdMethane.<br><b>Isp:</b> $/IspASLCH4$ / $/IspVacCH4$s <br><b>Thrust:</b> $/ThrustSLCH4$ / $/ThrustVacCH4$ kN<br><b>Flameout</b>: $/AtmFlameoutCH4$ atm
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleRCSFX
				}
				DATA
				{
					thrusterPower = #$/ThrustVacCH4$
					resourceName = LqdMethane
					PROPELLANT
					{
						name = LqdMethane
						ratio = 1
						resourceFlowMode = STAGE_PRIORITY_FLOW
						ignoreForThrustCurve = True
					}
					PROPELLANT
					{
						name = ThermalPower
						ratio = 0.52771
						@ratio *= #$/IspMult$
						IgnoreForIsp = True
						resourceFlowMode = STAGE_PRIORITY_FLOW
					}
					atmosphereCurve
					{
						key = #0 $/IspVacCH4$
						key = #1 $/IspASLCH4$
						key = #$/AtmFlameoutCH4$ 0.001
					}
				}
			}
		}
    		SUBTYPE
		{
			name = LCO
			title = Liquid Carbon Monoxide
			primaryColor = PurpleGrey
			secondaryColor = PurpleGrey
			descriptionDetail = #The thruster consumes LqdCO.<br><b>Isp:</b> $/IspASLCO$ / $/IspVacCO$s <br><b>Thrust:</b> $/ThrustSLCO$ / $/ThrustVacCO$ kN <br><b>Flameout</b>: $/AtmFlameoutCO$ atm
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleRCSFX
				}
				DATA
				{
					thrusterPower = #$/ThrustVacCO$
					resourceName = LqdCO
					PROPELLANT
					{
						name = LqdCO
						ratio = 1
						resourceFlowMode = STAGE_PRIORITY_FLOW
						ignoreForThrustCurve = True
					}
					PROPELLANT
					{
						name = ThermalPower
						ratio = 0.10674
						@ratio *= #$/IspMult$
						IgnoreForIsp = True
						resourceFlowMode = STAGE_PRIORITY_FLOW
					}
					atmosphereCurve
					{
						key = #0 $/IspVacCO$
						key = #1 $/IspASLCO$
						key = #$/AtmFlameoutCO$ 0.001
					}
				}
			}
		}
		SUBTYPE
		{
			name = LCO2
			title = Liquid Carbon Dioxide
			primaryColor = WarmGrey
			secondaryColor = WarmGrey
			descriptionDetail = #The thruster consumes LqdCO2.<br><b>Isp:</b> $/IspASLCO2$ / $/IspVacCO2$s <br><b>Thrust:</b> $/ThrustSLCO2$ / $/ThrustVacCO2$ kN <br><b>Flameout</b>: $/AtmFlameoutCO2$ atm
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleRCSFX
				}
				DATA
				{
					thrusterPower = #$/ThrustVacCO2$
					resourceName = LqdCO2
					PROPELLANT
					{
						name = LqdCO2
						ratio = 1
						resourceFlowMode = STAGE_PRIORITY_FLOW
						ignoreForThrustCurve = True
					}
					PROPELLANT
					{
						name = ThermalPower
						ratio = 0.12782
						@ratio *= #$/IspMult$
						IgnoreForIsp = True
						resourceFlowMode = STAGE_PRIORITY_FLOW
					}
					atmosphereCurve
					{
						key = #0 $/IspVacCO2$
						key = #1 $/IspASLCO2$
						key = #$/AtmFlameoutCO2$ 0.001
					}
				}
			}
		}
		SUBTYPE
		{
			name = H2O
			title = Water
			primaryColor = Ocean
			secondaryColor = Ocean
			descriptionDetail = #The thruster consumes Water.<br><b>Isp:</b> $/IspASLH2O$ / $/IspVacH2O$s <br><b>Thrust:</b> $/ThrustSLH2O$ / $/ThrustVacH2O$ kN <br><b>Flameout</b>: $/AtmFlameoutH2O$ atm
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleRCSFX
				}
				DATA
				{
					thrusterPower = #$/ThrustVacH2O$
					resourceName = Water
					PROPELLANT
					{
						name = Water
						ratio = 1
						resourceFlowMode = STAGE_PRIORITY_FLOW
						ignoreForThrustCurve = True
					}
					PROPELLANT
					{
						name = ThermalPower
						ratio = 0.21087
						@ratio *= #$/IspMult$
						IgnoreForIsp = True
						resourceFlowMode = STAGE_PRIORITY_FLOW
					}
					atmosphereCurve
					{
						key = #0 $/IspVacH2O$
						key = #1 $/IspASLH2O$
						key = #$/AtmFlameoutH2O$ 0.001
					}
				}
			}
		}
  		SUBTYPE
		{
			name = LN2
			title = Liquid Nitrogen
			primaryColor = PeacockBlue
			secondaryColor = PeacockBlue
			descriptionDetail = #The thruster consumes LqdNitrogen.<br><b>Isp:</b> $/IspASLN2$ / $/IspVacN2$s <br><b>Thrust:</b> $/ThrustSLN2$ / $/ThrustVacN2$ kN <br><b>Flameout</b>: $/AtmFlameoutN2$ atm
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleRCSFX
				}
				DATA
				{
					thrusterPower = #$/ThrustVacN2$
					resourceName = LqdNitrogen
					PROPELLANT
					{
						name = LqdNitrogen
						ratio = 1
						resourceFlowMode = STAGE_PRIORITY_FLOW
						ignoreForThrustCurve = True
					}
					PROPELLANT
					{
						name = ThermalPower
						ratio = 0.10674
						@ratio *= #$/IspMult$
						IgnoreForIsp = True
						resourceFlowMode = STAGE_PRIORITY_FLOW
					}
					atmosphereCurve
					{
						key = #0 $/IspVacN2$
						key = #1 $/IspASLN2$
						key = #$/AtmFlameoutN2$ 0.001
					}
				}
			}
		}
		SUBTYPE
		{
			name = LNH3
			title = Liquid Ammonia
			primaryColor = BurntRed
			secondaryColor = BurntRed
			descriptionDetail = #The thruster consumes LqdAmmonia.<br><b>Isp:</b> $/IspASLNH3$ / $/IspVacNH3$s <br><b>Thrust:</b> $/ThrustSLNH3$ / $/ThrustVacNH3$ kN <br><b>Flameout</b>: $/AtmFlameoutNH3$ atm
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleRCSFX
				}
				DATA
				{
					thrusterPower = #$/ThrustVacNH3$
					resourceName = LqdAmmonia
					PROPELLANT
					{
						name = LqdAmmonia
						ratio = 1
						resourceFlowMode = STAGE_PRIORITY_FLOW
						ignoreForThrustCurve = True
					}
					PROPELLANT
					{
						name = ThermalPower
						ratio = 0.26072
						@ratio *= #$/IspMult$
						IgnoreForIsp = True
						resourceFlowMode = STAGE_PRIORITY_FLOW
					}
					atmosphereCurve
					{
						key = #0 $/IspVacNH3$
						key = #1 $/IspASLNH3$
						key = #$/AtmFlameoutNH3$ 0.001
					}
				}
			}
		}
	}
}


// - - - - - Clean-up


