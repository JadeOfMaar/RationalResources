// This patch causes the RCS to require LPLM when any one of these is installed: 
// CryoEngines, Kerbal Atomics, Rational Resources.

@PART:HAS[#RRTN[Yes],@MODULE[ModuleRCSFX]]:FOR[RationalResourcesNuclearFamily]
{
	@RRTN = Joined
	// Let's go for 1.4x the Isp values of these fuels as given in RRNF
	IspVacLF = #$MODULE[ModuleRCSFX]/atmosphereCurve/key,0[1, ]$ // get vac Isp number; 800
	IspASLLF = #$MODULE[ModuleRCSFX]/atmosphereCurve/key,1[1, ]$ // get ASL Isp number; 160
	IspMult = #$IspVacLF$
	@IspMult /= 800
	
	IspVacPLM = 800 // 800
	IspASLPLM = 232 // - 71%
	IspVacRPT = 606 // 606
	IspASLRPT = 176 // - 71%
	IspVacCO2 = 283 // 283
	IspASLCO2 = 221 // - 22%
	IspVacH2O = 370 // 370
	IspASLH2O = 200 // - 46%
  	IspVacN2 = 253 // 253
	IspASLN2 = 197 // - 22%
	
	@IspVacPLM *= #$IspMult$
	@IspASLPLM *= #$IspMult$
	@IspVacRPT *= #$IspMult$
	@IspASLRPT *= #$IspMult$
	@IspVacCO2 *= #$IspMult$
	@IspASLCO2 *= #$IspMult$
	@IspVacH2O *= #$IspMult$
	@IspASLH2O *= #$IspMult$
  	@IspVacN2 *= #$IspMult$
	@IspASLN2 *= #$IspMult$
	
	ThrustVacPLM = #$MODULE[ModuleRCSFX]/thrusterPower$
	ThrustVacRPT = #$MODULE[ModuleRCSFX]/thrusterPower$
	@ThrustVacRPT *= 1.25
	ThrustVacCO2 = #$MODULE[ModuleRCSFX]/thrusterPower$
	@ThrustVacCO2 *= 2.41
	ThrustVacH2O = #$MODULE[ModuleRCSFX]/thrusterPower$
	@ThrustVacH2O *= 1.91
	ThrustVacN2 = #$MODULE[ModuleRCSFX]/thrusterPower$
	@ThrustVacN2 *= 2.58
	
	// LiquidFuel
	// Calculate ASL thrust
	ThrustSLLF = #$IspASLLF$
	@ThrustSLLF /= #$IspVacLF$
	@ThrustSLLF *= #$ThrustVacPLM$
	// Regex reduce value to 2dp
	@ThrustSLLF += 0.005
	@ThrustSLLF *= 100
	@ThrustSLLF = #$ThrustSLLF[0,.]$
	@ThrustSLLF /= 100
	// Calculate flameout pressure from Isp gradient: (Isp(Vac) / ( Isp(Vac) - Isp(ASL) ))
	AtmFlameoutLFTemp = #$IspVacLF$
	@AtmFlameoutLFTemp -= #$IspASLLF$
	AtmFlameoutLF = #$IspVacLF$
	@AtmFlameoutLF /= #$AtmFlameoutLFTemp$
	// Regex reduce value to 2dp
	@AtmFlameoutLF += 0.005
	@AtmFlameoutLF *= 100
	@AtmFlameoutLF = #$AtmFlameoutLF[0,.]$
	@AtmFlameoutLF /= 100
	
	// Hydrogen PLM
	// Calculate ASL thrust
	ThrustSLPLM = #$IspASLPLM$
	@ThrustSLPLM /= #$IspVacPLM$
	@ThrustSLPLM *= #$ThrustVacPLM$
	// Regex reduce value to 2dp
	@ThrustSLPLM += 0.005
	@ThrustSLPLM *= 100
	@ThrustSLPLM = #$ThrustSLPLM[0,.]$
	@ThrustSLPLM /= 100
	// Calculate flameout pressure from Isp gradient: (Isp(Vac) / ( Isp(Vac) - Isp(ASL) ))
	AtmFlameoutPLMTemp = #$IspVacPLM$
	@AtmFlameoutPLMTemp -= #$IspASLPLM$
	AtmFlameoutPLM = #$IspVacPLM$
	@AtmFlameoutPLM /= #$AtmFlameoutPLMTemp$
	// Regex reduce value to 2dp
	@AtmFlameoutPLM += 0.005
	@AtmFlameoutPLM *= 100
	@AtmFlameoutPLM = #$AtmFlameoutPLM[0,.]$
	@AtmFlameoutPLM /= 100
	
	// Methane RPT
	// Calculate ASL thrust
	ThrustSLRPT = #$IspASLRPT$
	@ThrustSLRPT /= #$IspVacRPT$
	@ThrustSLRPT *= #$ThrustVacRPT$
	// Regex reduce value to 2dp
	@ThrustSLRPT += 0.005
	@ThrustSLRPT *= 100
	@ThrustSLRPT = #$ThrustSLRPT[0,.]$
	@ThrustSLRPT /= 100
	// Calculate flameout pressure from Isp gradient: (Isp(Vac) / ( Isp(Vac) - Isp(ASL) ))
	AtmFlameoutRPTTemp = #$IspVacRPT$
	@AtmFlameoutRPTTemp -= #$IspASLRPT$
	AtmFlameoutRPT = #$IspVacRPT$
	@AtmFlameoutRPT /= #$AtmFlameoutRPTTemp$
	// Regex reduce value to 2dp
	@AtmFlameoutRPT += 0.005
	@AtmFlameoutRPT *= 100
	@AtmFlameoutRPT = #$AtmFlameoutRPT[0,.]$
	@AtmFlameoutRPT /= 100
	
	// Water H2O
	// Calculate ASL thrust
	ThrustSLH2O = #$IspASLH2O$
	@ThrustSLH2O /= #$IspVacH2O$
	@ThrustSLH2O *= #$ThrustVacH2O$
	// Regex reduce value to 2dp
	@ThrustSLH2O += 0.005
	@ThrustSLH2O *= 100
	@ThrustSLH2O = #$ThrustSLH2O[0,.]$
	@ThrustSLH2O /= 100
	// Calculate flameout pressure from Isp gradient: (Isp(Vac) / ( Isp(Vac) - Isp(ASL) ))
	AtmFlameoutH2OTemp = #$IspVacH2O$
	@AtmFlameoutH2OTemp -= #$IspASLH2O$
	AtmFlameoutH2O = #$IspVacH2O$
	@AtmFlameoutH2O /= #$AtmFlameoutH2OTemp$
	// Regex reduce value to 2dp
	@AtmFlameoutH2O += 0.005
	@AtmFlameoutH2O *= 100
	@AtmFlameoutH2O = #$AtmFlameoutH2O[0,.]$
	@AtmFlameoutH2O /= 100
 	
 	// Nitrogen N2
	// Calculate ASL thrust
	ThrustSLN2 = #$IspASLN2$
	@ThrustSLN2 /= #$IspVacN2$
	@ThrustSLN2 *= #$ThrustVacN2$
	// Regex reduce value to 2dp
	@ThrustSLN2 += 0.005
	@ThrustSLN2 *= 100
	@ThrustSLN2 = #$ThrustSLN2[0,.]$
	@ThrustSLN2 /= 100
	// Calculate flameout pressure from Isp gradient: (Isp(Vac) / ( Isp(Vac) - Isp(ASL) ))
	AtmFlameoutN2Temp = #$IspVacN2$
	@AtmFlameoutN2Temp -= #$IspASLN2$
	AtmFlameoutN2 = #$IspVacN2$
	@AtmFlameoutN2 /= #$AtmFlameoutN2Temp$
	// Regex reduce value to 2dp
	@AtmFlameoutN2 += 0.005
	@AtmFlameoutN2 *= 100
	@AtmFlameoutN2 = #$AtmFlameoutN2[0,.]$
	@AtmFlameoutN2 /= 100
		
	// Carbon Dioxide CO2
	// Calculate ASL thrust
	ThrustSLCO2 = #$IspASLCO2$
	@ThrustSLCO2 /= #$IspVacCO2$
	@ThrustSLCO2 *= #$ThrustVacCO2$
	// Regex reduce value to 2dp
	@ThrustSLCO2 += 0.005
	@ThrustSLCO2 *= 100
	@ThrustSLCO2 = #$ThrustSLCO2[0,.]$
	@ThrustSLCO2 /= 100
	// Calculate flameout pressure from Isp gradient: (Isp(Vac) / ( Isp(Vac) - Isp(ASL) ))
	AtmFlameoutCO2Temp = #$IspVacCO2$
	@AtmFlameoutCO2Temp -= #$IspASLCO2$
	AtmFlameoutCO2 = #$IspVacCO2$
	@AtmFlameoutCO2 /= #$AtmFlameoutCO2Temp$
	// Regex reduce value to 2dp
	@AtmFlameoutCO2 += 0.005
	@AtmFlameoutCO2 *= 100
	@AtmFlameoutCO2 = #$AtmFlameoutCO2[0,.]$
	@AtmFlameoutCO2 /= 100
	
	@description ^= :$: <br><#4FBBFF>RCS can accept other fuels.</color>
	@MODULE[ModuleRCSFX]
	{
		@resourceName = Propellium
		!PROPELLANT[ThermalPower] {}
		@PROPELLANT
		{
			@name = Propellium
			%ignoreForThrustCurve = True
		}
		@atmosphereCurve
		{
			!key,* = nope
			key = #0 $/IspVacPLM$
			key = #1 $/IspASLPLM$
			key = #$/AtmFlameoutPLM$ 0.001
		}
	}
	@MODULE[ModuleRCSFX]
	{
		PROPELLANT
		{
			name = ThermalPower
			ratio = 4.35101
			@ratio *= #$/IspMult$
			IgnoreForIsp = True
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
	}
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = RCS
		switcherDescription = RCS Mode
		switcherDescriptionPlural = RCS Modes
		switchInFlight = True
		
		SUBTYPE
		{
			name = Propellium
			title = Propellium
			primaryColor = ResourceColorLqdHydrogen
			secondaryColor = ResourceColorLqdHydrogen
			defaultSubtypePriority = 1
			descriptionDetail = #The thruster consumes Propellium.<br><b>Isp:</b> $/IspASLPLM$ / $/IspVacPLM$s <br><b>Thrust:</b> $/ThrustSLPLM$ / $/ThrustVacPLM$ kN<br><b>Flameout</b>: $/AtmFlameoutPLM$ atm
		}
		SUBTYPE
		{
			name = Raptium
			title = Raptium
			primaryColor = PurpleyPink
			secondaryColor = PurpleyPink
			descriptionDetail = #The thruster consumes Raptium.<br><b>Isp:</b> $/IspASLRPT$ / $/IspVacRPT$s <br><b>Thrust:</b> $/ThrustSLRPT$ / $/ThrustVacRPT$ kN<br><b>Flameout</b>: $/AtmFlameoutRPT$ atm
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleRCSFX
				}
				DATA
				{
					thrusterPower = #$/ThrustVacRPT$
					resourceName = Raptium
					PROPELLANT
					{
						name = Raptium
						ratio = 1
						resourceFlowMode = STAGE_PRIORITY_FLOW
						ignoreForThrustCurve = True
					}
					PROPELLANT
					{
						name = ThermalPower
						ratio = 15.8504
						@ratio *= #$/IspMult$
						IgnoreForIsp = True
						resourceFlowMode = STAGE_PRIORITY_FLOW
					}
					atmosphereCurve
					{
						key = #0 $/IspVacRPT$
						key = #1 $/IspASLRPT$
						key = #$/AtmFlameoutRPT$ 0.001
					}
				}
			}
		}
		SUBTYPE
		{
			name = CompressedAtmosphere
			title = Compressed Atmosphere
			primaryColor = WarmGrey
			secondaryColor = WarmGrey
			descriptionDetail = #The thruster consumes CompressedAtmosphere.<br><b>Isp:</b> $/IspASLCO2$ / $/IspVacCO2$s <br><b>Thrust:</b> $/ThrustSLCO2$ / $/ThrustVacCO2$ kN <br><b>Flameout</b>: $/AtmFlameoutCO2$ atm
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleRCSFX
				}
				DATA
				{
					thrusterPower = #$/ThrustVacCO2$
					resourceName = CompressedAtmosphere
					PROPELLANT
					{
						name = CompressedAtmosphere
						ratio = 1
						resourceFlowMode = STAGE_PRIORITY_FLOW
						ignoreForThrustCurve = True
					}
					PROPELLANT
					{
						name = ThermalPower
						ratio = 95.9641
						@ratio *= #$/IspMult$
						IgnoreForIsp = True
						resourceFlowMode = STAGE_PRIORITY_FLOW
					}
					atmosphereCurve
					{
						key = #0 $/IspVacCO2$
						key = #1 $/IspASLCO2$
						key = #$/AtmFlameoutCO2$ 0.001
					}
				}
			}
		}
		SUBTYPE
		{
			name = Water
			title = Water
			primaryColor = Ocean
			secondaryColor = Ocean
			descriptionDetail = #The thruster consumes Water.<br><b>Isp:</b> $/IspASLH2O$ / $/IspVacH2O$s <br><b>Thrust:</b> $/ThrustSLH2O$ / $/ThrustVacH2O$ kN <br><b>Flameout</b>: $/AtmFlameoutH2O$ atm
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleRCSFX
				}
				DATA
				{
					thrusterPower = #$/ThrustVacH2O$
					resourceName = Water
					PROPELLANT
					{
						name = Water
						ratio = 1
						resourceFlowMode = STAGE_PRIORITY_FLOW
						ignoreForThrustCurve = True
					}
					PROPELLANT
					{
						name = ThermalPower
						ratio = 14.8811
						@ratio *= #$/IspMult$
						IgnoreForIsp = True
						resourceFlowMode = STAGE_PRIORITY_FLOW
					}
					atmosphereCurve
					{
						key = #0 $/IspVacH2O$
						key = #1 $/IspASLH2O$
						key = #$/AtmFlameoutH2O$ 0.001
					}
				}
			}
		}
		SUBTYPE:NEEDS[SnacksFreshAir]
		{
			name = FreshAir
			title = Fresh Air
			primaryColor = CadetBlue
			secondaryColor = CadetBlue
			descriptionDetail = #The thruster consumes FreshAir.<br><b>Isp:</b> $/IspASLN2$ / $/IspVacN2$s <br><b>Thrust:</b> $/ThrustSLN2$ / $/ThrustVacN2$ kN <br><b>Flameout</b>: $/AtmFlameoutN2$ atm
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleRCSFX
				}
				DATA
				{
					thrusterPower = #$/ThrustVacN2$
					resourceName = FreshAir
					PROPELLANT
					{
						name = FreshAir
						ratio = 1
						resourceFlowMode = STAGE_PRIORITY_FLOW
						ignoreForThrustCurve = True
					}
					PROPELLANT
					{
						name = ThermalPower
						ratio = 6.5537
						@ratio *= #$/IspMult$
						IgnoreForIsp = True
						resourceFlowMode = STAGE_PRIORITY_FLOW
					}
					atmosphereCurve
					{
						key = #0 $/IspVacN2$
						key = #1 $/IspASLN2$
						key = #$/AtmFlameoutN2$ 0.001
					}
				}
			}
		}
	}
}


// - - - - - Clean-up


